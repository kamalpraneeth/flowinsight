[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowinsight"
version = "0.1.0"
description = "EDA Tool Log Analytics and Prediction Toolkit"
authors = [{ name = "FlowInsight Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
]

[project.scripts]
flowinsight = "flowinsight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowinsight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=flowinsight --cov-report=term-missing"
