name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff Linting
        run: |
          ruff check flowinsight tests

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=flowinsight --cov-report=term-missing --cov-report=xml

      - name: Smoke Test - CLI Generate, Parse, Train, Report
        run: |
          python -m flowinsight.cli generate --jobs 50 --seed 42 --output-dir data/ci_smoke
          python -m flowinsight.cli parse --manifest data/ci_smoke/manifest.csv --db data/ci_smoke/smoke.db
          python -m flowinsight.cli train --manifest data/ci_smoke/manifest.csv --output-dir models_ci
          python -m flowinsight.cli report --manifest data/ci_smoke/manifest.csv --output reports/ci_smoke_report.md

      - name: Test Bash Scripts
        run: |
          bash scripts/collect_logs.sh data/ci_smoke/logs data/ci_smoke/collected
          bash scripts/run_pipeline.sh data/ci_smoke/manifest.csv data/ci_smoke/smoke.db models_ci reports/ci_nightly.md

      - name: Build Docker Image
        run: |
          docker build -t flowinsight-api:ci .
